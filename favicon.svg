<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pg" gradientUnits="userSpaceOnUse" x1="106" y1="116" x2="406" y2="396">
      <stop offset="0" stop-color="#b59dfc"/>
      <stop offset="0.3" stop-color="#60a5fa"/>
      <stop offset="0.62" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16803c"/>
    </linearGradient>
    <linearGradient id="side" gradientUnits="userSpaceOnUse" x1="106" y1="116" x2="406" y2="396">
      <stop offset="0" stop-color="#4c2d95"/>
      <stop offset="0.3" stop-color="#1e3a8a"/>
      <stop offset="0.65" stop-color="#14532d"/>
      <stop offset="1" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="gloss" gradientUnits="userSpaceOnUse" x1="256" y1="116" x2="256" y2="396">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.38" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="106" y1="116" x2="406" y2="396">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowTL" gradientUnits="userSpaceOnUse" cx="120" cy="105" r="320">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" gradientUnits="userSpaceOnUse" cx="405" cy="415" r="320">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" gradientUnits="userSpaceOnUse" cx="256" cy="235" r="330">
      <stop offset="0.7" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

  <!-- tile stage -->
  <rect x="22" y="22" width="468" height="468" rx="104" fill="#0c1018" stroke="#253045" stroke-width="12"/>
  <rect x="22" y="22" width="468" height="468" rx="104" fill="url(#glowTL)"/>
  <rect x="22" y="22" width="468" height="468" rx="104" fill="url(#glowBR)"/>
  <rect x="22" y="22" width="468" height="468" rx="104" fill="url(#vignette)"/>

  <g transform="translate(-7 -7)">
    <!-- mark geometry (filled via wrappers) -->
    <defs>
      <g id="mark">
        <rect x="106" y="116" width="80" height="80" rx="14"/>
        <rect x="106" y="220" width="80" height="176" rx="12"/>
        <path d="M226 116 L306 116 C378 116 406 178 406 256 C406 334 378 396 306 396 L226 396 Z"/>
      </g>
    </defs>

    <!-- floating drop shadow -->
    <use href="#mark" transform="translate(10 26)" fill="#000000" opacity="0.5" filter="url(#blur)"/>

    <!-- extruded sides -->
    <g fill="url(#side)">
      <use href="#mark" transform="translate(14 14)"/>
      <use href="#mark" transform="translate(10.5 10.5)"/>
      <use href="#mark" transform="translate(7 7)"/>
      <use href="#mark" transform="translate(3.5 3.5)"/>
    </g>

    <!-- front faces + bevel light + glass sheen -->
    <g fill="url(#pg)"><use href="#mark"/></g>
    <g fill="none" stroke="url(#edge)" stroke-width="3"><use href="#mark"/></g>
    <g fill="url(#gloss)"><use href="#mark"/></g>

    <!-- $ engraved into the D: light catch below, dark groove on top -->
    <g transform="translate(239.6 170.2) scale(7.4)" fill="none" stroke="#a7f3d0" stroke-opacity="0.4" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="11" y1="1" x2="11" y2="23"/>
      <path d="M16 5H8.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H5"/>
    </g>
    <g transform="translate(236.6 167.2) scale(7.4)" fill="none" stroke="#071510" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="11" y1="1" x2="11" y2="23"/>
      <path d="M16 5H8.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H5"/>
    </g>
  </g>
</svg>